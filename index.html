<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3주기 자율성과지표 달성현황 | 명지전문대학</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  body { -webkit-font-smoothing: antialiased; }
  select, input, button { outline: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef } = React;

const C = {
  navy: "#0F2547", navy2: "#1B3A66", gold: "#B8975A",
  cream: "#F6F3EC", paper: "#FFFFFF", ink: "#1A2235", sub: "#5B6577", line: "#E6E1D6",
  done: "#1F7A4D", good: "#2563A8", warn: "#C99A2E", risk: "#B23A48", idle: "#9AA3B2",
};
const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';

function clean(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === "string") {
    const t = v.replace(/\n/g, " ").trim();
    if (t === "" || t === "-") return null;
    return t;
  }
  return v;
}
function num(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === "number") return v;
  const n = parseFloat(String(v).replace(/[, ]/g, ""));
  return isNaN(n) ? null : n;
}

function parseRows(matrix) {
  let gb = null, sb = null;
  const out = [];
  for (let i = 4; i < matrix.length; i++) {
    const row = matrix[i] || [];
    const no = clean(row[2]);
    const name = clean(row[3]);
    if (no == null && name == null) continue;
    if (name == null) continue;
    if (clean(row[0])) gb = clean(row[0]);
    if (clean(row[1])) sb = clean(row[1]);
    const dept = clean(row[4]);
    const noStr = String(no ?? "");
    const isSub = noStr.includes("-");
    const isSubtotal = dept === null || /지수/.test(String(name));
    out.push({
      no: noStr, gb, sb, name, dept: dept || "-", unit: clean(row[5]) || "",
      t25: num(row[6]), a25: num(row[7]),
      t26: num(row[9]), a26: num(row[10]), r26: num(row[11]), t27: num(row[12]),
      isSub, isSubtotal,
    });
  }
  return out;
}
function findBaseDate(matrix) {
  for (let i = 0; i < Math.min(matrix.length, 4); i++) {
    const row = matrix[i] || [];
    for (const cell of row) {
      if (typeof cell === "string" && cell.includes("기준")) {
        const m = cell.match(/[\d.]+/);
        if (m) return m[0].replace(/\.$/, "");
      }
    }
  }
  return null;
}
function statusOf(r) {
  if (r.t26 == null || r.t26 === 0) return { key: "na", label: "목표없음", color: C.idle };
  const a = r.a26 == null ? 0 : r.a26;
  const ratio = a / r.t26;
  if (a === 0) return { key: "idle", label: "미착수", color: C.idle, ratio: 0 };
  if (ratio >= 1) return { key: "done", label: "달성", color: C.done, ratio };
  if (ratio >= 0.6) return { key: "good", label: "양호", color: C.good, ratio };
  if (ratio >= 0.3) return { key: "warn", label: "주의", color: C.warn, ratio };
  return { key: "risk", label: "지연", color: C.risk, ratio };
}
const fmt = (n) =>
  n == null ? "-" : Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined, { maximumFractionDigits: 1 });

const INITIAL = [
  { no: "60", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "산업체 MOU 확대(누적)", dept: "산학협력팀", unit: "건", t25: 160, a25: 197, t26: 190, a26: 205, r26: 1.079, t27: 220 },
  { no: "61", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "산학협력 프로그램 참여기업 확대", dept: "산학협력팀", unit: "개", t25: 250, a25: 529, t26: 300, a26: 93, r26: 0.31, t27: 350 },
  { no: "62", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "산학협력협의체(협의회) 운영 횟수", dept: "산학협력팀", unit: "회", t25: 120, a25: 122, t26: 140, a26: 21, r26: 0.15, t27: 160 },
  { no: "63", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "ICC 협의체 구성 확산", dept: "산학협력팀", unit: "개", t25: 2, a25: 3, t26: 4, a26: 0, r26: 0, t27: 6 },
  { no: "64", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "ICC 프로그램 운영 건수 확대", dept: "산학협력팀", unit: "건", t25: 100, a25: 195, t26: 130, a26: 24, r26: 0.185, t27: 150 },
  { no: "65", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "산학공동 기술개발과제 추진", dept: "산학협력팀", unit: "건", t25: 5, a25: 5, t26: 6, a26: 0, r26: 0, t27: 8 },
  { no: "100", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "현장실무 역량강화 지수(66~69)", dept: "-", unit: "명", t25: 3440, a25: 3646, t26: 3800, a26: 2266, r26: null, t27: 4160, isSubtotal: true },
  { no: "66", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "디자인씽킹 이수자", dept: "산학AI융합지원팀", unit: "명", t25: 300, a25: 337, t26: 400, a26: 357, r26: 0.893, t27: 500 },
  { no: "67", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "캡스톤디자인 이수자", dept: "산학AI융합지원팀", unit: "명", t25: 1950, a25: 2050, t26: 2100, a26: 1373, r26: 0.654, t27: 2250 },
  { no: "68", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "현장실습 이수자", dept: "현장실습지원센터 학사지원팀", unit: "명", t25: 790, a25: 764, t26: 800, a26: 0, r26: 0, t27: 810 },
  { no: "69", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "사회맞춤형 이수자", dept: "산학AI융합지원팀", unit: "명", t25: 400, a25: 495, t26: 500, a26: 536, r26: 1.072, t27: 600 },
  { no: "70", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "현장 전문가 연계 프로그램 참여학생 수", dept: "취·창업팀 산학협력팀", unit: "명", t25: 4000, a25: 4869, t26: 4800, a26: 662, r26: 0.138, t27: 5600 },
  { no: "71", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "특성화기반 평생교육 이수자 수", dept: "평생교육팀", unit: "명", t25: 500, a25: 571, t26: 600, a26: 0, r26: 0, t27: 700 },
  { no: "72", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "특성화기반 평생교육 참여자 만족도", dept: "평생교육팀", unit: "점", t25: 90, a25: 90.3, t26: 91, a26: 0, r26: 0, t27: 92 },
  { no: "73", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "지역수요 기반 평생교육 이수자 수", dept: "평생교육팀", unit: "명", t25: 600, a25: 697, t26: 700, a26: 0, r26: 0, t27: 800 },
  { no: "74", sb: "지산학 협력 플랫폼 기반 지역공동체 혁신", name: "지역수요 기반 평생교육 참여자 만족도", dept: "평생교육팀", unit: "점", t25: 90, a25: 90.4, t26: 91, a26: 0, r26: 0, t27: 92 },
].map((d) => ({ gb: "산학·지역협력혁신", isSub: false, isSubtotal: false, ...d }));

function Dashboard() {
  const [rows, setRows] = useState(INITIAL);
  const [baseDate, setBaseDate] = useState("2026.05.31");
  const [dept, setDept] = useState("전체");
  const [sort, setSort] = useState("연번");
  const [q, setQ] = useState("");
  const [showSub, setShowSub] = useState(false);
  const [err, setErr] = useState("");
  const fileRef = useRef(null);

  const main = useMemo(() => rows.filter((r) => !r.isSubtotal && !r.isSub), [rows]);
  const depts = useMemo(() => ["전체", ...Array.from(new Set(main.map((r) => r.dept)))], [main]);

  const stat = useMemo(() => {
    const valid = main.filter((r) => r.t26 != null && r.t26 !== 0);
    let done = 0, idle = 0, prog = 0, ratioSum = 0;
    valid.forEach((r) => {
      const s = statusOf(r);
      if (s.key === "done") done++;
      else if (s.key === "idle") idle++;
      else prog++;
      ratioSum += Math.min(s.ratio ?? 0, 1);
    });
    return { total: main.length, done, prog, idle, avg: valid.length ? (ratioSum / valid.length) * 100 : 0 };
  }, [main]);

  const byDept = useMemo(() => {
    const m = {};
    main.forEach((r) => {
      if (r.t26 == null || r.t26 === 0) return;
      const ratio = Math.min((r.a26 ?? 0) / r.t26, 1);
      (m[r.dept] ??= []).push(ratio);
    });
    return Object.entries(m)
      .map(([d, arr]) => ({ dept: d, avg: (arr.reduce((a, b) => a + b, 0) / arr.length) * 100, n: arr.length }))
      .sort((a, b) => b.avg - a.avg);
  }, [main]);

  const list = useMemo(() => {
    let arr = rows.filter((r) => showSub || (!r.isSub && !r.isSubtotal));
    if (dept !== "전체") arr = arr.filter((r) => r.dept === dept);
    if (q.trim()) arr = arr.filter((r) => (r.name + r.dept + r.no).includes(q.trim()));
    arr = [...arr].sort((a, b) => {
      if (sort === "진척낮은순") {
        const ra = a.t26 ? (a.a26 ?? 0) / a.t26 : 99;
        const rb = b.t26 ? (b.a26 ?? 0) / b.t26 : 99;
        return ra - rb;
      }
      return parseFloat(a.no) - parseFloat(b.no) || a.no.localeCompare(b.no);
    });
    return arr;
  }, [rows, dept, q, sort, showSub]);

  function onFile(e) {
    setErr("");
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
        const parsed = parseRows(matrix);
        if (!parsed.length) throw new Error("지표 데이터를 찾지 못했습니다. 양식(헤더/열 위치)을 확인하세요.");
        setRows(parsed);
        setBaseDate(findBaseDate(matrix) || baseDate);
      } catch (e) {
        setErr("파싱 실패: " + e.message);
      }
    };
    reader.readAsArrayBuffer(f);
    e.target.value = "";
  }

  return (
    <div style={{ background: C.cream, minHeight: "100vh", fontFamily: FONT, color: C.ink }}>
      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "28px 22px 60px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 14, borderBottom: "2px solid " + C.navy, paddingBottom: 16 }}>
          <div>
            <div style={{ fontSize: 12, letterSpacing: 3, color: C.gold, fontWeight: 700 }}>명지전문대학 · 전문대학 혁신지원사업</div>
            <h1 style={{ margin: "6px 0 0", fontSize: 27, fontWeight: 800, color: C.navy, letterSpacing: -0.5 }}>3주기 자율성과지표 달성현황</h1>
            <div style={{ marginTop: 6, fontSize: 13, color: C.sub }}>기준일 <b style={{ color: C.navy }}>{baseDate}</b> · 정량지표 {stat.total}개</div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => fileRef.current?.click()} style={{ background: C.navy, color: "#fff", border: "none", borderRadius: 8, padding: "11px 18px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>⬆ 엑셀 업로드 / 갱신</button>
            <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={onFile} style={{ display: "none" }} />
          </div>
        </div>

        {err && (<div style={{ marginTop: 14, background: "#FBEAEC", color: C.risk, padding: "10px 14px", borderRadius: 8, fontSize: 13, fontWeight: 600 }}>⚠ {err}</div>)}
        <div style={{ marginTop: 10, fontSize: 12, color: C.sub }}>동일 양식(헤더 3~4행, 데이터 5행~)의 엑셀을 업로드하면 지표값이 자동 갱신됩니다.</div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))", gap: 14, marginTop: 22 }}>
          <KPI label="평균 진척률 (2026)" value={stat.avg.toFixed(1) + "%"} accent={C.navy} note="목표 대비 (상한 100%)" />
          <KPI label="목표 달성" value={stat.done + "건"} accent={C.done} note="진척률 100% 이상" />
          <KPI label="진행 중" value={stat.prog + "건"} accent={C.good} note="착수·진행 단계" />
          <KPI label="미착수" value={stat.idle + "건"} accent={C.idle} note="실적 0 / 하반기 예정 포함" />
        </div>

        <Section title="부서별 평균 진척률">
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {byDept.map((d) => (
              <div key={d.dept} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 150, fontSize: 13, fontWeight: 600, textAlign: "right", color: C.ink, flexShrink: 0 }}>{d.dept}</div>
                <div style={{ flex: 1, height: 22, background: "#EDEAE1", borderRadius: 5, overflow: "hidden" }}>
                  <div style={{ width: Math.min(d.avg, 100) + "%", height: "100%", background: "linear-gradient(90deg," + C.navy2 + "," + C.gold + ")", borderRadius: 5, transition: "width .5s" }} />
                </div>
                <div style={{ width: 78, fontSize: 13, fontWeight: 700, color: C.navy }}>{d.avg.toFixed(1)}% <span style={{ color: C.sub, fontWeight: 400, fontSize: 11 }}>({d.n})</span></div>
              </div>
            ))}
          </div>
        </Section>

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginTop: 30 }}>
          <select value={dept} onChange={(e) => setDept(e.target.value)} style={selStyle}>
            {depts.map((d) => <option key={d}>{d}</option>)}
          </select>
          <select value={sort} onChange={(e) => setSort(e.target.value)} style={selStyle}>
            <option value="연번">연번순</option>
            <option value="진척낮은순">진척 낮은순</option>
          </select>
          <input placeholder="지표 검색…" value={q} onChange={(e) => setQ(e.target.value)} style={{ ...selStyle, minWidth: 160 }} />
          <label style={{ fontSize: 13, color: C.sub, display: "flex", alignItems: "center", gap: 6, cursor: "pointer", marginLeft: "auto" }}>
            <input type="checkbox" checked={showSub} onChange={(e) => setShowSub(e.target.checked)} /> 소계·세부분해 표시
          </label>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(330px,1fr))", gap: 14, marginTop: 16 }}>
          {list.map((r) => <Card key={r.no} r={r} />)}
        </div>

        <div style={{ marginTop: 30, fontSize: 11, color: C.sub, textAlign: "center" }}>진척률은 2026 목표값 대비 {baseDate} 달성값 비율 · 실적 0은 하반기 예정 사업을 포함할 수 있습니다.</div>
      </div>
    </div>
  );
}

const selStyle = { padding: "9px 12px", borderRadius: 8, border: "1px solid " + C.line, background: "#fff", fontSize: 13, color: C.ink, fontFamily: FONT };

function KPI({ label, value, accent, note }) {
  return (
    <div style={{ background: C.paper, border: "1px solid " + C.line, borderRadius: 12, padding: "16px 18px", borderTop: "3px solid " + accent }}>
      <div style={{ fontSize: 12, color: C.sub, fontWeight: 600 }}>{label}</div>
      <div style={{ fontSize: 30, fontWeight: 800, color: accent, marginTop: 4, letterSpacing: -1 }}>{value}</div>
      <div style={{ fontSize: 11, color: C.sub, marginTop: 2 }}>{note}</div>
    </div>
  );
}
function Section({ title, children }) {
  return (
    <div style={{ marginTop: 26, background: C.paper, border: "1px solid " + C.line, borderRadius: 12, padding: "18px 20px" }}>
      <div style={{ fontSize: 15, fontWeight: 800, color: C.navy, marginBottom: 14 }}>{title}</div>
      {children}
    </div>
  );
}
function Card({ r }) {
  const s = statusOf(r);
  const pct = s.ratio == null ? 0 : Math.min(s.ratio * 100, 100);
  const overflow = (s.ratio ?? 0) > 1;
  return (
    <div style={{ background: C.paper, border: "1px solid " + C.line, borderRadius: 12, padding: "16px 16px 14px", display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div>
          <div style={{ fontSize: 11, color: C.gold, fontWeight: 700 }}>NO.{r.no} · {r.dept}</div>
          <div style={{ fontSize: 14.5, fontWeight: 700, color: C.ink, marginTop: 3, lineHeight: 1.35 }}>{r.name}</div>
        </div>
        <span style={{ background: s.color, color: "#fff", fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 20, whiteSpace: "nowrap", flexShrink: 0 }}>{s.label}</span>
      </div>
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 5 }}>
          <span style={{ color: C.sub }}>2026 진척</span>
          <span style={{ fontWeight: 800, color: s.color }}>{s.ratio == null ? "-" : (s.ratio * 100).toFixed(1) + "%"}</span>
        </div>
        <div style={{ height: 10, background: "#EDEAE1", borderRadius: 5, overflow: "hidden" }}>
          <div style={{ width: pct + "%", height: "100%", background: s.color, borderRadius: 5, transition: "width .5s" }} />
        </div>
        <div style={{ fontSize: 12.5, marginTop: 7, color: C.ink }}>
          <b style={{ color: C.navy, fontSize: 15 }}>{fmt(r.a26)}</b>
          <span style={{ color: C.sub }}> / 목표 {fmt(r.t26)} {r.unit}</span>
          {overflow && <span style={{ color: C.done, fontWeight: 700 }}> · 초과달성</span>}
        </div>
      </div>
      <div style={{ display: "flex", gap: 0, borderTop: "1px dashed " + C.line, paddingTop: 9, fontSize: 11.5 }}>
        <YearMini y="2025" t={r.t25} a={r.a25} />
        <YearMini y="2026" t={r.t26} a={r.a26} hi />
        <YearMini y="2027" t={r.t27} a={null} target />
      </div>
    </div>
  );
}
function YearMini({ y, t, a, hi, target }) {
  return (
    <div style={{ flex: 1, textAlign: "center", borderRight: "1px solid #EFEBE2" }}>
      <div style={{ color: hi ? C.navy : C.sub, fontWeight: hi ? 800 : 600, fontSize: 11 }}>{y}</div>
      <div style={{ marginTop: 2, color: C.ink }}>
        {target ? (<span style={{ color: C.gold, fontWeight: 700 }}>목표 {fmt(t)}</span>)
        : (<><span style={{ fontWeight: 700 }}>{fmt(a)}</span><span style={{ color: C.sub }}> /{fmt(t)}</span></>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
</script>
